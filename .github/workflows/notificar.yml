name: Enviar notificações

on:
  schedule:
    - cron: '7 12 * * *'   # todo dia às 9h07 de Brasília
  workflow_dispatch:
    inputs:
      teste_para:
        description: 'Nome de uma pessoa para mandar só um aviso de teste (deixe vazio para o envio normal)'
        required: false
        default: ''

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save firebase-admin@12
      - run: node scripts/notificar.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TESTE_PARA: ${{ github.event.inputs.teste_para }}
